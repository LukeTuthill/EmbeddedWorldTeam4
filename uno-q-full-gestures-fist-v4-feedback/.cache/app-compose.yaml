name: uno-q-full-gestures-fist-v4-feedback
include:
- /var/lib/arduino-app-cli/assets/0.12.0/compose/arduino/object_detection/brick_compose.yaml
services:
  main:
    image: ghcr.io/arduino/app-bricks/python-apps-base:0.12.0
    depends_on:
      ei-obj-detection-runner:
        condition: service_healthy
    volumes:
    - type: bind
      source: /home/arduino/ArduinoApps/uno-q-full-gestures-fist-v4-feedback
      target: /app
    - type: bind
      source: /dev
      target: /dev
    - type: bind
      source: /run/udev
      target: /run/udev
      read_only: true
    - type: bind
      source: /run/user/1000/pipewire-0
      target: /run/user/1000/pipewire-0
    - type: bind
      source: /run/arduino-router.sock
      target: /run/arduino-router.sock
    - type: bind
      source: /sys/class/leds/blue:user
      target: /sys/class/leds/blue:user
    - type: bind
      source: /sys/class/leds/green:user
      target: /sys/class/leds/green:user
    - type: bind
      source: /sys/class/leds/red:user
      target: /sys/class/leds/red:user
    - type: bind
      source: /sys/class/leds/blue:bt
      target: /sys/class/leds/blue:bt
    - type: bind
      source: /sys/class/leds/green:wlan
      target: /sys/class/leds/green:wlan
    - type: bind
      source: /sys/class/leds/red:panic
      target: /sys/class/leds/red:panic
    device_cgroup_rules:
    - c 226:* rmw
    - c 251:* rmw
    - c 505:* rmw
    - c 81:* rmw
    - c 116:* rmw
    ports: []
    user: 1000:1000
    group_add:
    - 44
    - 29
    - 991
    - 20
    - 1001
    entrypoint: /run.sh
    extra_hosts:
    - msgpack-rpc-router:host-gateway
    labels:
      cc.arduino.app: "true"
      cc.arduino.app.main: "true"
      cc.arduino.app.path: /home/arduino/ArduinoApps/uno-q-full-gestures-fist-v4-feedback
    environment:
      APP_HOME: /home/arduino/ArduinoApps/uno-q-full-gestures-fist-v4-feedback
      BIND_ADDRESS: 127.0.0.1
      BOARD_NAME: unoq
      CUSTOM_MODEL_PATH: /home/arduino/.arduino-bricks/ei-models
      EI_OBJ_DETECTION_MODEL: /models/ootb/ei/hand-gestures.eim
      EI_V_OBJ_DETECTION_MODEL: /models/ootb/ei/hand-gestures.eim
      HOST_IP: 10.36.254.155
      MODELS_PATH: /var/lib/arduino-app-cli/models
      VIDEO_DEVICE: /dev/video0
      XDG_RUNTIME_DIR: /run/user/1000
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
